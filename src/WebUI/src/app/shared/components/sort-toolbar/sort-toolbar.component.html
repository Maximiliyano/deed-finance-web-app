<div class="sort-bar segmented">
  @for (option of options(); track option.key) {
    <button
      type="button"
      class="segmented-btn"
      [class.active]="value() === option.key"
      [attr.aria-label]="option.title"
      [attr.aria-pressed]="value() === option.key"
      [title]="option.title"
      (click)="changed.emit(option.key)"
    >
      <i class="fas" [class]="option.icon"></i>
    </button>
  }
</div>
