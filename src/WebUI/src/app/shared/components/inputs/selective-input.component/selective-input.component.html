<div class="tags-input">
  <div class="tags-field">
    @for (tagName of selectedTags; track tagName) {
      <span class="tag-chip">
        {{ tagName }}
        <button type="button" class="tag-remove" aria-label="Remove tag" (click)="removeTag(tagName)">&times;</button>
      </span>
    }

    <input
      type="text"
      [formControl]="inputCtrl"
      [placeholder]="placeholder"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (keydown)="addFromInput($event)"
      autocomplete="off"
    />
  </div>

  @if (showDropdown && filteredSuggestions.length) {
    <ul class="tag-suggestions">
      @for (tag of filteredSuggestions; track tag.tagId) {
        <li (mousedown)="selectTag(tag.name)">{{ tag.name }}</li>
      }
    </ul>
  }
</div>
