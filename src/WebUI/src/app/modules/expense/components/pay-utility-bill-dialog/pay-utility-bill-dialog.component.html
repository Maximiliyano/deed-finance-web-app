<form [formGroup]="form" (ngSubmit)="submit()" class="pub-dialog">
  <div class="pub-header">
    <i class="fas fa-circle-check"></i>
    Pay {{ bill.name }}
  </div>

  <div class="pub-body">
    <p class="pub-hint">
      Estimated: <strong>{{ bill.estimatedAmount }} {{ bill.currency }}</strong> · adjust to the actual amount if different.
    </p>

    <div class="form-group">
      <label class="form-label">Actual Amount ({{ bill.currency }})</label>
      <input type="number" class="input" formControlName="amount" min="0.01" step="0.01" autocomplete="off">
    </div>

    <div class="form-group">
      <label class="form-label">Payment Date</label>
      <input type="date" class="input" formControlName="paymentDate">
    </div>
  </div>

  <div class="pub-footer">
    <button type="button" class="btn btn-secondary btn-sm" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn btn-success btn-sm" [disabled]="form.invalid">
      <i class="fas fa-check"></i> Mark Paid
    </button>
  </div>
</form>
