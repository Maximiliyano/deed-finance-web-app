<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="dialog-header">
    <h2 class="dialog-title">{{ isEdit ? 'Edit utility bill' : 'Add utility bill' }}</h2>
  </div>

  <div class="dialog-body">
    <div class="form-group">
      <label for="name" class="form-label">Name</label>
      <input
        id="name"
        type="text"
        class="input"
        formControlName="name"
        placeholder="e.g. Electric, Water, Internet"
        autocomplete="off"
      />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="estimatedAmount" class="form-label">Estimated amount</label>
        <input id="estimatedAmount" appNumeric class="input" formControlName="estimatedAmount" />
      </div>
      <div class="form-group">
        <label for="currency" class="form-label">Currency</label>
        <select id="currency" class="input" formControlName="currency">
          @for (c of currencies; track c) {
            <option [value]="c">{{ c }}</option>
          }
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="dueDayOfMonth" class="form-label">Due day of month</label>
      <input id="dueDayOfMonth" appNumeric="integer" class="input" formControlName="dueDayOfMonth" />
    </div>

    <div class="form-group">
      <label for="capitalId" class="form-label">Capital</label>
      <select id="capitalId" class="input" formControlName="capitalId">
        @for (cap of capitals; track cap.id) {
          <option [value]="cap.id">{{ cap.name }} ({{ cap.currency }})</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="categoryId" class="form-label">Category</label>
      <select id="categoryId" class="input" formControlName="categoryId">
        @for (cat of categories; track cat.id) {
          <option [value]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </div>

    <label class="checkbox-row">
      <input type="checkbox" formControlName="isActive" class="checkbox" />
      <span class="checkbox-label">Active (show as pending each month)</span>
    </label>
  </div>

  <div class="dialog-footer">
    <button type="button" class="btn btn-secondary btn-sm" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn btn-primary btn-sm" [disabled]="form.invalid || (isEdit && form.pristine)">
      {{ isEdit ? 'Save' : 'Add' }}
    </button>
  </div>
</form>
