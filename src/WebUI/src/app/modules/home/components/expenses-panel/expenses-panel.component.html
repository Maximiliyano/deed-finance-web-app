<div id="expenses" class="card">
  <div class="card-header">
    <h2>
      <span class="icon-chip chip-danger"><i class="fas fa-arrow-trend-down"></i></span> Expenses
    </h2>
    <div class="card-header-actions">
      <span class="badge badge-danger">{{ total() | currencySymbol: userCurrency() }}</span>
      <button type="button" class="btn btn-danger btn-sm" (click)="addExpense()">
        <i class="fas fa-plus"></i> Add
      </button>
      <button type="button" class="btn btn-secondary btn-sm" (click)="manageCategories()">
        <i class="fas fa-tags"></i> Categories
      </button>
    </div>
  </div>
  <app-period-bar [state]="period" />
  @if (store.hasCapitalFilter()) {
    <div class="filter-note">
      <i class="fas fa-filter"></i> Showing {{ store.selectedCapitalIds().size }} selected
      {{ store.selectedCapitalIds().size === 1 ? 'capital' : 'capitals' }}
      <button type="button" class="btn btn-ghost btn-sm" (click)="store.clearCapitals()">Show all</button>
    </div>
  }
  @if (groups().length > 1) {
    <app-sort-toolbar [options]="sortOptions" [value]="sortBy()" (changed)="sort($event)" />
  }
  <app-panel-state
    [loading]="loading()"
    [empty]="groups().length === 0"
    icon="fa-money-bill-wave"
    title="No expenses in this period"
    hint="Add an expense or pick another period to see a breakdown here."
  >
    <app-category-breakdown
      [groups]="groups()"
      [currency]="userCurrency()"
      entity="expense"
      tone="danger"
      [reorderable]="reorderable()"
      [readonly]="isAnonymous()"
      (reordered)="reorder($event)"
      (edit)="editExpense($event)"
      (removed)="deleteExpense($event)"
    />
  </app-panel-state>
</div>
