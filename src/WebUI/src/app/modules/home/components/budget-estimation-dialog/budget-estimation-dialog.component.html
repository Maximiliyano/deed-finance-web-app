<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="dialog-header">
    <h2 class="dialog-title">{{ isEdit ? 'Edit estimation' : 'Add estimation' }}</h2>
  </div>

  <div class="dialog-body">
    <div class="form-group">
      <label for="description" class="form-label">Description</label>
      <input
        id="description"
        type="text"
        class="input"
        formControlName="description"
        placeholder="e.g. Rent, Groceries"
        autocomplete="off"
      />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="budgetAmount" class="form-label">Budget amount</label>
        <input id="budgetAmount" appNumeric class="input" formControlName="budgetAmount" />
      </div>
      <div class="form-group">
        <label for="budgetCurrency" class="form-label">Currency</label>
        <select id="budgetCurrency" class="input" formControlName="budgetCurrency">
          @for (c of currencies; track c) {
            <option [value]="c">{{ c }}</option>
          }
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="capitalId" class="form-label">Capital (optional)</label>
      <select id="capitalId" class="input" formControlName="capitalId">
        <option value="">None</option>
        @for (cap of capitals; track cap.id) {
          <option [value]="cap.id">{{ cap.name }} ({{ cap.currency }})</option>
        }
      </select>
    </div>

    @if (isEdit) {
      <label class="checkbox-row">
        <input type="checkbox" formControlName="isCompleted" class="checkbox" />
        <span class="checkbox-label">Mark as completed</span>
      </label>
    }

    @if (selectedCapital) {
      <div class="stat-tile">
        <div class="est-summary-row">
          <span class="stat-label">Total spent</span>
          <span class="est-summary-val text-danger"
            >{{ totalSpent | number: '1.2-2' }} {{ selectedCapital.currency }}</span
          >
        </div>
        <div class="est-summary-row">
          <span class="stat-label">Remains</span>
          <span class="est-summary-val" [class.text-success]="remains >= 0" [class.text-danger]="remains < 0">
            {{ remains | number: '1.2-2' }} {{ form.get('budgetCurrency')?.value }}
          </span>
        </div>
      </div>
    }
  </div>

  <div class="dialog-footer">
    <button type="button" class="btn btn-secondary btn-sm" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn btn-primary btn-sm" [disabled]="form.invalid || (isEdit && form.pristine)">
      {{ isEdit ? 'Save' : 'Add' }}
    </button>
  </div>
</form>
