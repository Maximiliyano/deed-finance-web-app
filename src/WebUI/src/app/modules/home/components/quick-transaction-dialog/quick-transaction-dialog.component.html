<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="dialog-header" [class.is-expense]="isExpense" [class.is-income]="!isExpense">
    <h2 class="dialog-title">{{ isEdit ? 'Edit' : 'Add' }} {{ isExpense ? 'expense' : 'income' }}</h2>
  </div>

  <div class="dialog-body">
    <div class="form-group">
      <label for="amount" class="form-label">Amount</label>
      <input id="amount" appNumeric class="input" formControlName="amount" placeholder="0.00" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="capitalId" class="form-label">Capital</label>
        <select id="capitalId" class="input" formControlName="capitalId" [attr.disabled]="isEdit ? true : null">
          <option [ngValue]="null" disabled>Select capital</option>
          @for (cap of capitals; track cap.id) {
            <option [ngValue]="cap.id">{{ cap.name }} ({{ cap.currency }})</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label for="categoryId" class="form-label">
          Category
          <button
            type="button"
            class="new-category-btn"
            [attr.aria-label]="showNewCategory ? 'Cancel new category' : 'New category'"
            (click)="toggleNewCategory()"
          >
            <i class="fas" [class.fa-xmark]="showNewCategory" [class.fa-plus]="!showNewCategory"></i>
          </button>
        </label>
        @if (showNewCategory) {
          <div class="new-category">
            <input
              type="text"
              class="input"
              aria-label="New category name"
              [(ngModel)]="newCategoryName"
              [ngModelOptions]="{ standalone: true }"
              placeholder="Category name"
              maxlength="64"
            />
            <button
              type="button"
              class="btn btn-primary btn-sm"
              [disabled]="!newCategoryName.trim()"
              (click)="createCategory()"
            >
              Add
            </button>
          </div>
        } @else {
          <select id="categoryId" class="input" formControlName="categoryId">
            <option [ngValue]="null" disabled>Select category</option>
            @for (cat of categories; track cat.id) {
              <option [ngValue]="cat.id">{{ cat.name }}</option>
            }
          </select>
        }
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="paymentDate" class="form-label">Date</label>
        <input id="paymentDate" type="date" class="input" formControlName="paymentDate" />
      </div>
      <div class="form-group">
        <label for="purpose" class="form-label">Purpose (optional)</label>
        <input
          id="purpose"
          type="text"
          class="input"
          formControlName="purpose"
          placeholder="What for"
          autocomplete="off"
        />
      </div>
    </div>

    @if (isExpense) {
      <div class="form-group">
        <label for="tags" class="form-label">Tags (optional, comma separated)</label>
        <input
          id="tags"
          type="text"
          class="input"
          formControlName="tags"
          placeholder="groceries, weekly"
          autocomplete="off"
          enterkeyhint="done"
        />
      </div>
    }
  </div>

  <div class="dialog-footer">
    <button type="button" class="btn btn-secondary btn-sm" (click)="cancel()">Cancel</button>
    <button
      type="submit"
      class="btn btn-sm"
      [class.btn-danger]="isExpense"
      [class.btn-success]="!isExpense"
      [disabled]="form.invalid || (isEdit && form.pristine)"
    >
      {{ isEdit ? 'Save' : isExpense ? 'Add expense' : 'Add income' }}
    </button>
  </div>
</form>
