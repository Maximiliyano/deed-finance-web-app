<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="dialog-header">
    <h2 class="dialog-title">{{ isEdit ? 'Edit goal' : 'Add goal' }}</h2>
  </div>

  <div class="dialog-body">
    <div class="form-group">
      <label for="title" class="form-label">Title</label>
      <input
        id="title"
        type="text"
        class="input"
        formControlName="title"
        placeholder="e.g. Emergency fund, New car"
        autocomplete="off"
      />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="targetAmount" class="form-label">Target amount</label>
        <input id="targetAmount" appNumeric class="input" formControlName="targetAmount" />
      </div>
      <div class="form-group">
        <label for="currency" class="form-label">Currency</label>
        <select id="currency" class="input" formControlName="currency">
          @for (c of currencies; track c) {
            <option [value]="c">{{ c }}</option>
          }
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="currentAmount" class="form-label">Current amount</label>
      <input id="currentAmount" appNumeric class="input" formControlName="currentAmount" />
    </div>

    <div class="goal-progress">
      <div class="progress">
        <div class="progress-bar" [class.tone-success]="progress >= 100" [style.width.%]="progress"></div>
      </div>
      <span class="goal-progress-pct">{{ progress }}%</span>
    </div>

    <div class="form-group">
      <label for="deadline" class="form-label">Deadline (optional)</label>
      <input id="deadline" type="date" class="input" formControlName="deadline" />
    </div>

    <div class="form-group">
      <label for="note" class="form-label">Note (optional)</label>
      <textarea id="note" class="input textarea" formControlName="note" placeholder="Any notes"></textarea>
    </div>

    @if (isEdit) {
      <label class="checkbox-row">
        <input type="checkbox" formControlName="isCompleted" class="checkbox" />
        <span class="checkbox-label">Mark as completed</span>
      </label>
    }
  </div>

  <div class="dialog-footer">
    <button type="button" class="btn btn-secondary btn-sm" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn btn-primary btn-sm" [disabled]="form.invalid || (isEdit && form.pristine)">
      {{ isEdit ? 'Save' : 'Add goal' }}
    </button>
  </div>
</form>
