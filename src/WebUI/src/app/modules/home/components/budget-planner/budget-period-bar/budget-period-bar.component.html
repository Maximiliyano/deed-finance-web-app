<div class="period-bar">
  <div class="segmented period-tabs" role="tablist" aria-label="Period">
    @for (option of periods; track option.key) {
      <button
        type="button"
        role="tab"
        class="segmented-btn"
        [class.active]="store.planFilter() === option.key"
        [attr.aria-selected]="store.planFilter() === option.key"
        (click)="store.setPlanFilter(option.key)"
      >
        {{ option.label }}
      </button>
    }
  </div>

  <div class="period-nav">
    <button type="button" class="segmented-btn" aria-label="Previous period" (click)="store.shiftPeriod(-1)">
      <i class="fas fa-chevron-left"></i>
    </button>

    @switch (store.planFilter()) {
      @case ('day') {
        <input
          type="date"
          class="input period-input"
          [attr.aria-label]="selectedPeriodLabel()"
          [value]="selectedDay()"
          (change)="onDayChange($any($event.target).value)"
        />
      }
      @case ('month') {
        <input
          type="month"
          class="input period-input"
          [attr.aria-label]="selectedPeriodLabel()"
          [value]="selectedMonth()"
          (change)="onMonthChange($any($event.target).value)"
        />
      }
      @case ('year') {
        <input
          appNumeric="integer"
          class="input period-input period-input-year"
          [attr.aria-label]="selectedPeriodLabel()"
          [value]="selectedYear()"
          (change)="onYearChange($any($event.target).value)"
        />
      }
    }

    <button type="button" class="segmented-btn" aria-label="Next period" (click)="store.shiftPeriod(1)">
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>
</div>
